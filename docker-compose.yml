# Phase 01 needs Postgres. Phase 03 needs pgvector in the same database, so use
# the image that already has the extension rather than migrating later.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage
    ports:
      - "5433:5432"     # 5433 on the host, so it can't collide with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
